machine_name: "My-PC"

telegram:
  bot_token: "YOUR_BOT_TOKEN_HERE"
  allowed_chat_ids:
    - 111111111

server:
  listen_addr: "127.0.0.1:3847"

notifications:
  thresholds: [30, 15, 5, 1]

tts:
  model: "en_US-lessac-medium"

users:
  - name: "user1"
    daily_limit_minutes: 300
    allowed_hours:
      start: 8
      end: 18
    # Optional per-weekday overrides. Each listed day replaces the default
    # allowed_hours above for that day only; unlisted days fall back to it.
    # Day keys are lowercase full names (monday..sunday).
    # allowed_hours_by_day:
    #   saturday:
    #     start: 7
    #     end: 20
    #   sunday:
    #     start: 9
    #     end: 20
